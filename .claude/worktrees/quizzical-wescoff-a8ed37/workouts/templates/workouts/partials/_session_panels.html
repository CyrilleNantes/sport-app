<section class="grid two">
  <div class="panel">
    <h2>Ajouter une serie</h2>
    <form method="post" action="{% url 'workouts:ajouter_ligne' seance.pk %}" class="form compact-grid">
      {% csrf_token %}
      {{ add_line_form.as_p }}
      <button class="button" type="submit">Ajouter</button>
    </form>
  </div>

  <div class="panel">
    <h2>Notes</h2>
    <form method="post" action="{% url 'workouts:update_notes' seance.pk %}" class="form stack">
      {% csrf_token %}
      {{ notes_form.as_p }}
      <button class="button" type="submit">Enregistrer</button>
    </form>
  </div>
</section>
