<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" font-family="system-ui, -apple-system, sans-serif">

  <!-- ── Silhouette ─────────────────────────────────────────── -->

  <!-- Head -->
  <ellipse cx="160" cy="52" rx="30" ry="36" fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="150" y="84" width="20" height="18" rx="4" fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Torso -->
  <path d="M110 100 Q90 108 88 148 Q86 185 95 210 Q105 235 160 238 Q215 235 225 210 Q234 185 232 148 Q230 108 210 100 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Left arm -->
  <path d="M110 103 Q82 112 74 150 Q68 178 72 215 Q74 228 82 230 Q90 231 93 218 Q96 198 98 175 Q102 145 108 120 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Right arm -->
  <path d="M210 103 Q238 112 246 150 Q252 178 248 215 Q246 228 238 230 Q230 231 227 218 Q224 198 222 175 Q218 145 212 120 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Hips / pelvis -->
  <path d="M95 210 Q88 240 92 268 Q96 285 160 288 Q224 285 228 268 Q232 240 225 210 Q215 235 160 238 Q105 235 95 210 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Left leg -->
  <path d="M92 268 Q82 295 85 340 Q87 370 90 395 Q93 415 102 416 Q112 417 114 400 Q116 378 115 350 Q114 318 118 288 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Right leg -->
  <path d="M228 268 Q238 295 235 340 Q233 370 230 395 Q227 415 218 416 Q208 417 206 400 Q204 378 205 350 Q206 318 202 288 Z"
        fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- Left foot -->
  <ellipse cx="98" cy="422" rx="16" ry="10" fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>
  <!-- Right foot -->
  <ellipse cx="222" cy="422" rx="16" ry="10" fill="#dfe5dc" stroke="#667064" stroke-width="1.5"/>

  <!-- ── Measurement lines ───────────────────────────────────── -->

  <!-- Poitrine line (y≈136) -->
  <line x1="93" y1="136" x2="227" y2="136" stroke="#147d64" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Taille line (y≈185) -->
  <line x1="90" y1="185" x2="230" y2="185" stroke="#d74c2f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Hanches line (y≈255) -->
  <line x1="91" y1="255" x2="229" y2="255" stroke="#147d64" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Bras dot on left arm (around y≈160) -->
  <circle cx="75" cy="162" r="5" fill="#d74c2f"/>
  <!-- Cuisse dot on left leg (around y≈315) -->
  <circle cx="91" cy="315" r="5" fill="#147d64"/>

  <!-- ── Labels (right side) ─────────────────────────────────── -->

  <!-- Poitrine -->
  <line x1="227" y1="136" x2="248" y2="136" stroke="#147d64" stroke-width="1.2"/>
  <text x="252" y="140" font-size="12" fill="#147d64" font-weight="700">Poitrine</text>

  <!-- Taille -->
  <line x1="230" y1="185" x2="248" y2="185" stroke="#d74c2f" stroke-width="1.2"/>
  <text x="252" y="189" font-size="12" fill="#d74c2f" font-weight="700">Taille</text>

  <!-- Hanches -->
  <line x1="229" y1="255" x2="248" y2="255" stroke="#147d64" stroke-width="1.2"/>
  <text x="252" y="259" font-size="12" fill="#147d64" font-weight="700">Hanches</text>

  <!-- Bras (left side label) -->
  <line x1="70" y1="162" x2="52" y2="162" stroke="#d74c2f" stroke-width="1.2"/>
  <text x="2" y="166" font-size="12" fill="#d74c2f" font-weight="700">Bras</text>

  <!-- Cuisse (left side label) -->
  <line x1="86" y1="315" x2="52" y2="315" stroke="#147d64" stroke-width="1.2"/>
  <text x="2" y="319" font-size="12" fill="#147d64" font-weight="700">Cuisse</text>

  <!-- ── Title ──────────────────────────────────────────────── -->
  <text x="160" y="490" text-anchor="middle" font-size="11" fill="#667064" font-weight="600" letter-spacing="0.05em">GUIDE DE MESURE</text>

</svg>
