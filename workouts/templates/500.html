<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur serveur — Sport app</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --ink: #17211a;
      --muted: #667064;
      --primary: #147d64;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    header {
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      min-height: 64px;
      border-bottom: 1px solid #dfe5dc;
      background: #fff;
    }
    header a {
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }
    main {
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    h1 {
      font-size: 2.75rem;
      line-height: 0.98;
      margin: 0 0 1rem;
    }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    .button {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      border: 2px solid var(--primary);
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">Sport app</a>
  </header>
  <main>
    <p class="eyebrow">Erreur 500</p>
    <h1>Problème serveur</h1>
    <p>Une erreur inattendue s'est produite. L'équipe a été notifiée. Réessaie dans quelques instants.</p>
    <a class="button" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
