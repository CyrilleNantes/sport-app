<section class="session-header">
  <div>
    <p class="eyebrow">{{ seance.get_statut_display }}</p>
    <h1>{{ seance }}</h1>
    <p class="muted">
      Debut: {{ seance.started_at|date:"H:i"|default:"-" }}
      / Fin: {{ seance.ended_at|date:"H:i"|default:"-" }}
      / Duree: {{ seance.duration|default:"-" }}
    </p>
  </div>
  <div class="actions">
    {% if seance.statut != "COMPLETED" %}
      <form method="post" action="{% url 'workouts:demarrer_seance' seance.pk %}">
        {% csrf_token %}
        <button class="button" type="submit">Debut seance</button>
      </form>
      <form method="post" action="{% url 'workouts:terminer_seance' seance.pk %}">
        {% csrf_token %}
        <button class="button primary" type="submit">Fin seance</button>
      </form>
    {% endif %}
  </div>
</section>
